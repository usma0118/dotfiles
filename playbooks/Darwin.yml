---
- name: Setting up mac environment
  hosts:
    - mac
  gather_facts: true
  any_errors_fatal: true
  pre_tasks:
    - name: Exit if not running on macOS
      ansible.builtin.fail:
        msg: "This playbook is intended for macOS only."
      when: ansible_facts['os_family'] != "Darwin"
    - name: Ensuring Homebrew Is Installed
      ansible.builtin.stat:
        path: brew
      register: homebrew_check
    - name: Fail If Homebrew Is Not Installed and install_homebrew_if_missing Is False
      ansible.builtin.fail:
        msg: Homebrew is missing...Install from http://brew.sh/
      when:
        - not homebrew_check.stat.exists
    - name: Update homebrew and packages
      community.general.homebrew:
        update_homebrew: true
        upgrade_all: true
      when:
        - homebrew_check.stat.exists
  roles:
    - role: common
      common_user: "{{ ansible_user | default(lookup('env', 'USER'), True) }}"
    - role: ohmyzsh
      ohmyzsh_user: "{{ ansible_user | default(lookup('env', 'USER'), True) }}"
    - role: osx
  tasks:
    # ensure sops key is loaded and placed
    # install sops
    # install 1password
    # whatsapp via appstore,magnet, facebook messenger
    # signal
    # install vscode
    # install kubectl
    - name: Install osx components
      block:
        - name: Homebrew
          community.general.homebrew:
            name: "{{ item }}"
            state: present
            with_items:
              - podman
              # - multipass
        - name: Homebrew cask for common
          community.general.homebrew_cask:
            name: "{{ item }}"
            state: present
            with_items:
              - tradingview
              - drawio
              - visual-studio-code
              - iterm2
              - signal
              - dozer
        - name: Install cask apps for personal mac only
          community.general.homebrew_cask:
            name: "{{ item }}"
            state: present
          when:
            - inventory_hostname == "mac"
          loop:
            - 1password-cli
            - autodesk-fusion
            - bambu-studio
            - dropbox
            - firefox
            - vivaldi
            - dozer
